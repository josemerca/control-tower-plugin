name: Continuous Integration

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The plugin lives in plugin/ (the `source` the marketplace distributes) and
# the API lives in backend/ (never distributed). Each has its own package.json
# and lockfile, so each job pins its working-directory and its npm cache to
# the package it actually builds — a root-level `npm ci` has nothing to
# install anymore.
jobs:
  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: plugin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install
        run: npm ci

      # Three ways the committed dist/ can be wrong, and a plain
      # `git diff --exit-code -- dist/` only catches one of them: a bundle whose
      # bytes changed. It is blind to a bundle the build now emits that nobody
      # committed (untracked files are invisible to git diff) and to a committed
      # bundle the build no longer emits (esbuild does not clean its outdir).
      # Both were reproduced. Wiping the directory, rebuilding and staging makes
      # all three show up as an index-against-HEAD difference.
      #
      # The dist/ pathspecs below are relative to plugin/ (the job's
      # working-directory); git resolves pathspecs against the cwd, so they
      # keep naming plugin/dist/ without spelling the prefix.
      - name: Check the committed dist matches the sources
        run: |
          rm -rf dist
          npm run build
          git add -A -- dist/
          if ! git diff --cached --exit-code -- dist/; then
            echo "::error::dist/ does not match the sources: the diff above is what a clean rebuild produces."
            echo "dist/ is tracked and holds the bundles that are actually executed:"
            echo "  - hooks/hooks.json runs dist/session-start.js, dist/stop.js and dist/commit-keyword-guard.js — never the sources in hooks/."
            echo "  - templates/scope-gate.yml vendors dist/scope-check.js into governed repos; no hook imports it."
            echo "The canonical input list of every bundle lives in __tests__/dist-coherente-con-fuentes.test.js."
            echo "Fix: run 'npm run build' inside plugin/ and commit the diff of plugin/dist/ as part of the same change."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: plugin
    steps:
      # fetch-depth: 0 is not caution, it is a requirement two tests state out
      # loud. ct-init.test.js:301 refuses to run its provenance check on a
      # shallow clone ("the commit that put the hash in the ledger may fall
      # below the graft, and the test would accuse a correct ledger of forgery")
      # and task-brief.test.js:50 does `git show <sha>:<path>` against a commit
      # that a depth-1 clone does not have.
      #
      # persist-credentials: false because nothing here pushes, and `npm test`
      # spawns dozens of this repo's own subprocesses inside this checkout — no
      # reason to leave the token sitting in .git/config while they run.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install
        run: npm ci

      - name: Run tests
        run: npm test

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      # A shallow clone is enough here: backend's suite only asks git for the
      # present (`ls-files` in the yardstick census), never for history.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Run tests
        run: npm test

  # `!cancelled()` and not `always()`. With cancel-in-progress above, a push that
  # supersedes a running check would leave this job running, read `cancelled`
  # from its dependencies and exit 1 — so the required check would show up as a
  # failure instead of a cancellation. The precedent this workflow follows uses
  # `always()`, but it has no concurrency group and never meets the combination.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [dist, test, backend]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.dist.result }}" != "success" || "${{ needs.test.result }}" != "success" || "${{ needs.backend.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
